name: Build and release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: windows-amd64
            cgo: '0'

          - os: ubuntu-22.04
            target: linux-amd64
            cgo: '1'

    env:
      CGO_ENABLED: ${{ matrix.cgo }}
      GOFLAGS: -mod=readonly
      # A tag build knows its version, which turns on its updates
      # (internal/update); other builds are development builds.
      VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install Gio dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc \
            pkg-config \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxkbcommon-x11-dev \
            libgles2-mesa-dev \
            libegl1-mesa-dev \
            libffi-dev \
            libxcursor-dev \
            libxfixes-dev \
            libvulkan-dev

      # go.mod replaces go-text with the patched copy this builds.
      - name: Apply dependency patches
        run: sh patches/apply.sh

      - name: Verify dependencies
        run: |
          go mod download
          go mod verify

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l cmd internal)

          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build all packages
        run: go build ./...

      # =========================
      # Windows
      # =========================

      - name: Build Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bin/dist | Out-Null

          go build `
            -trimpath `
            -ldflags "-s -w -H=windowsgui -X main.version=$env:VERSION" `
            -o bin/dist/OpenWA-windows-amd64.exe `
            ./cmd/wazzap

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload Windows executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          path: bin/dist/OpenWA-windows-amd64.exe
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Package FFmpeg for Windows voice notes
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg-essentials.zip'
          $url = 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip'
          Invoke-WebRequest -Uri $url -OutFile $archive
          $checksum = (Invoke-RestMethod -Uri "$url.sha256" -TimeoutSec 30).Trim().Split(' ')[0].ToLowerInvariant()
          $actual = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $checksum) { throw 'FFmpeg archive checksum mismatch' }
          $extracted = Join-Path $env:RUNNER_TEMP 'ffmpeg-essentials'
          Expand-Archive -Path $archive -DestinationPath $extracted
          $binary = Get-ChildItem -Path $extracted -Filter 'ffmpeg.exe' -Recurse -File | Select-Object -First 1
          $license = Get-ChildItem -Path $extracted -Filter 'LICENSE*' -Recurse -File | Select-Object -First 1
          if (-not $binary -or -not $license) { throw 'FFmpeg binary or license missing from archive' }
          Copy-Item $binary.FullName 'bin/dist/ffmpeg.exe'
          Copy-Item $license.FullName 'bin/dist/ffmpeg-LICENSE.txt'
          $encoders = & '.\bin\dist\ffmpeg.exe' -hide_banner -encoders
          $devices = & '.\bin\dist\ffmpeg.exe' -hide_banner -devices
          if (($encoders | Out-String) -notmatch 'libopus') { throw 'FFmpeg is missing libopus' }
          if (($devices | Out-String) -notmatch 'dshow') { throw 'FFmpeg is missing DirectShow' }
          Compress-Archive -Path 'bin/dist/OpenWA-windows-amd64.exe','bin/dist/ffmpeg.exe','bin/dist/ffmpeg-LICENSE.txt' -DestinationPath 'bin/dist/OpenWA-windows-portable.zip'

      - name: Upload Windows portable package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          path: bin/dist/OpenWA-windows-portable.zip
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

          # Inno Setup wants a plain number; development builds are 0.0.0.
          $ver = if ($env:VERSION) { $env:VERSION.TrimStart('v') } else { '0.0.0' }

          & $iscc /Qp "/DAppVersion=$ver" installer/wazzap.iss

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          path: bin/dist/OpenWA-Setup.exe
          archive: false
          if-no-files-found: error
          retention-days: 14

      # =========================
      # Linux
      # =========================

      - name: Build Linux executable
        if: runner.os == 'Linux'
        run: |
          mkdir -p bin/dist

          go build \
            -trimpath \
            -ldflags "-s -w -X main.version=$VERSION" \
            -o bin/dist/OpenWA-linux-amd64 \
            ./cmd/wazzap

          chmod +x bin/dist/OpenWA-linux-amd64

      - name: Upload Linux executable
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          path: bin/dist/OpenWA-linux-amd64
          archive: false
          if-no-files-found: error
          retention-days: 14

  android:
    name: Build (android-arm+arm64)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      GOFLAGS: -mod=readonly

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK and NDK
        run: |
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          if [[ -z "$sdkmanager" ]]; then
            echo "Android SDK command-line tools missing from $ANDROID_HOME" >&2
            exit 1
          fi
          "$sdkmanager" --install \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'ndk;27.2.12479018'

      - name: Apply dependency patches
        run: sh patches/apply.sh

      - name: Verify dependencies
        run: |
          go mod download
          go mod verify

      - name: Install Gio Android packager
        run: go install gioui.org/cmd/gogio@v0.10.3

      # Optional persistent signature for installing newer APKs over older ones.
      # Without these secrets gogio generates a temporary development key.
      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" ]]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/wago.keystore"
            echo "ANDROID_SIGN_KEY=$RUNNER_TEMP/wago.keystore" >> "$GITHUB_ENV"
          elif [[ -n "$ANDROID_KEYSTORE_BASE64" || -n "$ANDROID_KEYSTORE_PASSWORD" ]]; then
            echo 'Configure both ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD.' >&2
            exit 1
          else
            echo '::warning::Using a temporary Android debug signing key; subsequent APK installs may require uninstalling the old build.'
          fi

      - name: Build installable Android APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p bin/dist
          app_version='0.1.0'
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            app_version="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$app_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Android requires a three-component version tag: vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          sign_options=()
          if [[ -n "${ANDROID_SIGN_KEY:-}" ]]; then
            sign_options=(-signkey "$ANDROID_SIGN_KEY" -signpass "$ANDROID_KEYSTORE_PASSWORD")
          fi

          "$(go env GOPATH)/bin/gogio" \
            -target android \
            -arch arm,arm64 \
            -minsdk 21 \
            -targetsdk 35 \
            -appid com.muleff.wago \
            -name WaGo \
            -version "$app_version.$GITHUB_RUN_NUMBER" \
            "${sign_options[@]}" \
            -o bin/dist/OpenWA-android.apk \
            ./cmd/android

      - name: Verify Android APK
        run: |
          test -s bin/dist/OpenWA-android.apk
          unzip -t bin/dist/OpenWA-android.apk
          unzip -Z -1 bin/dist/OpenWA-android.apk | grep -q 'lib/armeabi-v7a/libgio.so'
          unzip -Z -1 bin/dist/OpenWA-android.apk | grep -q 'lib/arm64-v8a/libgio.so'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose bin/dist/OpenWA-android.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging bin/dist/OpenWA-android.apk |
            grep "package: name='com.muleff.wago'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions bin/dist/OpenWA-android.apk |
            grep -q 'android.permission.INTERNET'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions bin/dist/OpenWA-android.apk |
            grep -q 'android.permission.RECORD_AUDIO'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions bin/dist/OpenWA-android.apk |
            grep -q 'android.permission.READ_EXTERNAL_STORAGE'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions bin/dist/OpenWA-android.apk |
            grep -q 'android.permission.CAMERA'

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: OpenWA-android.apk
          path: bin/dist/OpenWA-android.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

  release:
    name: Draft release

    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    needs: [build, android]

    runs-on: ubuntu-22.04

    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Download Windows build
        uses: actions/download-artifact@v8
        with:
          name: OpenWA-windows-amd64.exe
          path: dist

      - name: Download Windows installer
        uses: actions/download-artifact@v8
        with:
          name: OpenWA-Setup.exe
          path: dist

      - name: Download Windows portable package
        uses: actions/download-artifact@v8
        with:
          name: OpenWA-windows-portable.zip
          path: dist

      - name: Download Linux build
        uses: actions/download-artifact@v8
        with:
          name: OpenWA-linux-amd64
          path: dist

      - name: Download Android APK
        uses: actions/download-artifact@v8
        with:
          name: OpenWA-android.apk
          path: dist

      - name: Show downloaded files
        run: |
          ls -lah dist

      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum \
            OpenWA-windows-amd64.exe \
            OpenWA-windows-portable.zip \
            OpenWA-Setup.exe \
            OpenWA-linux-amd64 \
            OpenWA-android.apk \
            > SHA256SUMS

          sha256sum --check SHA256SUMS

      # The app only installs updates whose SHA256SUMS this key signed
      # (internal/update). signrelease uses only the standard library, so
      # it builds as a module of its own, without the patched go-text.
      - name: Sign checksums
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo 'The RELEASE_SIGNING_KEY secret is missing; see docs/releasing.md.' >&2
            exit 1
          fi

          sign="$RUNNER_TEMP/signrelease"
          mkdir -p "$sign"
          cp cmd/signrelease/main.go "$sign/"
          cd "$sign"
          go mod init signrelease
          go run . "$GITHUB_WORKSPACE/dist/SHA256SUMS"

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}

        run: |
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft'); then

            if [ "$draft" != 'true' ]; then
              echo 'Release already published; refusing to replace its assets.' >&2
              exit 1
            fi

            gh release upload "$RELEASE_TAG" \
              dist/OpenWA-windows-amd64.exe \
              dist/OpenWA-windows-portable.zip \
              dist/OpenWA-Setup.exe \
              dist/OpenWA-linux-amd64 \
              dist/OpenWA-android.apk \
              dist/SHA256SUMS \
              dist/SHA256SUMS.sig \
              --clobber

          else

            gh release create "$RELEASE_TAG" \
              dist/OpenWA-windows-amd64.exe \
              dist/OpenWA-windows-portable.zip \
              dist/OpenWA-Setup.exe \
              dist/OpenWA-linux-amd64 \
              dist/OpenWA-android.apk \
              dist/SHA256SUMS \
              dist/SHA256SUMS.sig \
              --verify-tag \
              --draft \
              --generate-notes \
              --title "OpenWA $RELEASE_TAG"

          fi
